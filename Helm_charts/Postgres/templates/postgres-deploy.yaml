apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deploy
  labels:
    name: postgres-deploy
    app: auth-app
spec:
  replicas: 1
  selector:
    matchLabels:
      name: postgres-pod
      app: auth-app
  template:
    metadata:
      name: postgres-pod
      labels:
        name: postgres-pod
        app: auth-app
    spec:
      nodeSelector:
        kubernetes.io/hostname: kind-worker3 # Matches the 3rd worker node in the kind cluster
      containers:
      - name: postgres
        image: {{ .Values.container.image }}
        ports:
        - containerPort: {{ .Values.service.port }}
        env:
          - name: POSTGRES_USER
            value: {{ .Values.container.env.user }}
          - name: POSTGRES_PASSWORD
            value: {{ .Values.container.env.password }}
          - name: POSTGRES_DB
            value: {{ .Values.container.env.db }}
          - name: POSTGRES_HOST_AUTH_METHOD
            value: trust
          # These variables match the placeholders in your ConfigMap SQL script
          - name: LOGIN_EMAIL
            value: {{ .Values.container.env.login_email | quote }}
          - name: LOGIN_PASSWORD
            value: {{ .Values.container.env.login_pass | quote }}
        volumeMounts:
          - name: postgres-storage
            mountPath: /var/lib/postgresql
          # Mount the shell wrapper script to execute first
          - name: init-scripts
            mountPath: /docker-entrypoint-initdb.d/00-init.sh
            subPath: init.sh
          # Mount the raw SQL to a temp folder so the shell script can parse it
          - name: init-scripts
            mountPath: /tmp/init.sql
            subPath: init.sql
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - psql
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
            - -c
            - SELECT 1;
          initialDelaySeconds: 45  # Extended to ensure init.sql finishes executing first
          periodSeconds: 20
          timeoutSeconds: 10       # Wider window so heavy queries don't trigger a false restart
          failureThreshold: 3
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc-standard # This must match the name in your PVC manifest
      - name: init-scripts
        configMap:
          name: postgres-init-script
          defaultMode: 0755 # Gives execute permission to the init.sh file
