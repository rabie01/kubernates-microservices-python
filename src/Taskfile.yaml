version: "3.2"

dotenv: ['../.env']
tasks:
  svc:install-all:
    desc: Install all the services
    deps:
      - svc:install-auth
      - svc:install-converter
      - svc:install-gateway
      - svc:install-notification

  svc:install-auth:
    desc: Install authentication service
    cmds:
      - echo "🚀 Deploying auth service..."
      - docker build -t $DOCKER_REPO/auth:latest -f ./auth-service/Dockerfile ./auth-service
      - docker login
      - docker push $DOCKER_REPO/auth:latest
      # - kind load docker-image $DOCKER_REPO/auth:latest
      - kubectl apply -f ./auth-service/manifest/. -n $NAMESPACE

  svc:install-converter:
    desc: Install converter service
    cmds:
      - echo "🚀 Deploying converter service..."
      - docker build -t $DOCKER_REPO/converter:latest -f ./converter-service/Dockerfile ./converter-service
      - docker login
      - docker push $DOCKER_REPO/converter:latest
      # - kind load docker-image $DOCKER_REPO/converter:latest
      - kubectl apply -f ./converter-service/manifest/. -n $NAMESPACE

  svc:install-gateway:
    desc: Install gateway service
    cmds:
      - echo "🚀 Deploying gateway service..."
      - docker build -t $DOCKER_REPO/gateway:latest -f ./gateway-service/Dockerfile ./gateway-service
      - docker login
      - docker push $DOCKER_REPO/gateway:latest
      # - kind load docker-image $DOCKER_REPO/gateway:latest
      - kubectl apply -f ./gateway-service/manifest/. -n $NAMESPACE

  svc:install-notification:
    desc: Install notification service
    cmds:
      - echo "🚀 Deploying notification service..."
      - docker build -t $DOCKER_REPO/notification:latest -f ./notification-service/Dockerfile ./notification-service
      - docker login
      - docker push $DOCKER_REPO/notification:latest
      # - kind load docker-image $DOCKER_REPO/notification:latest
      - kubectl apply -f ./notification-service/manifest/. -n $NAMESPACE


  api:login:
    desc: "Login and get JWT token"
    cmds:
      - |
        echo "🔐 Logging in..."
        # Use -w to get the status code and -o to save the body
        HTTP_RESPONSE=$(curl -s -w "%{http_code}" -o .temp_body.txt -X POST http://$API_HOST:$API_PORT/login -u $LOGIN_EMAIL:$LOGIN_PASS)
        
        if [ "$HTTP_RESPONSE" -ne 200 ]; then
          echo "❌ Login failed with status: $HTTP_RESPONSE"
          cat .temp_body.txt # Show the error
          exit 1
        fi

        mv .temp_body.txt .jwt_token
        echo "✅ JWT token obtained."

  api:upload:
    desc: "Upload a video file using JWT token"
    deps: [api:login]
    cmds:
      - |
        # set -x
        echo "📤 Uploading video.mp4..."
        TOKEN=$(cat .jwt_token)
        curl -X POST -F 'file=@../assets/video.mp4' \
          -H "Authorization: Bearer $TOKEN" \
          http://$API_HOST:$API_PORT/upload | tee fid.txt

  api:download:
    desc: "Download audio file by file ID. Usage: task api:download -- FILE_ID=<your_id>"
    deps: [api:login]
    cmds:
      - |
        #set -x
        FILE_ID=$(jq -r .mp3_fid fid.txt)
        if [ -z $FILE_ID ]; then
          echo "❗ FILE_ID is required. Use: task api:download -- FILE_ID=abc123"
          exit 1
        fi
        echo "📥 Downloading audio for file ID {{.FILE_ID}}..."
        TOKEN=$(cat .jwt_token)
        curl --output ../assets/audio.mp3 -X GET \
          -H "Authorization: Bearer $TOKEN" \
          "http://$API_HOST:$API_PORT/download?fid=$FILE_ID"


  api:test-all:
    desc: "Test full API flow: login, upload, download"
    cmds:
      - task: api:login
      - task: api:upload
      - |
        FILE_ID=$(jq -r .mp3_fid fid.txt)
        if [ -z $FILE_ID ]; then
          echo "⚠️ Skipping download: FILE_ID not provided."
        else
          task api:download -- FILE_ID=$FILE_ID
        fi






  debug-cmds:
    desc: common debugging commands
    cmds:
      - echo "docker exec -it kind-control-plane crictl images ls"  #list images locally available in a k8 node
      - echo "kubectl cluster-info dump"
      - echo "kubectl logs podname -n <namespace>"
      - echo "kubectl describe pod <podname> -n <namespace>"
      - echo "kubectl get events -n <namespace>"
      - echo "kubectl get pods -n <namespace>"
      - echo "kubectl get svc -n <namespace>"
      - echo "kubectl get deployments --show-labels"
      - echo "kubectl rollout restart deploy <deploy>"
      - echo "k logs --selector=app=gateway"
      - echo "kubens <namespace>"
      - echo "kubetail <appname>" #partial or full match of the pod name to get logs from multiple pods
      - echo "stern <appname>"  #partial or full match of the pod name to get logs from multiple pods
      - echo "kubectl port-forward svc/<service-name> <local-port>:<remote-port> -n <namespace>" #port forward to access a service locally
      - echo "kubectl top pods -n <namespace>" #check resource usage of pods
      - echo "kubectl top nodes" #check resource usage of nodes
      - echo "kubectl get ingress -n <namespace>" #check ingress resources
      - echo 'kubectl exec -it postgres-deploy-55b4bfdc7-6sfr5 -- psql -U rabie -d authdb -c "SELECT * FROM auth_user;"' #exec into postgres pod and run a query
      - echo 'kubectl exec postgres-deploy-55b4bfdc7-6sfr5 -- psql -U rabie -d authdb -c "SELECT count(*) FROM pg_stat_activity;"' #check number of active connections to postgres"
      - echo "kubectl debug -it <pod-name> -n <namespace> --image=busybox -- sh" #debug into a pod with a busybox container
      - echo "kubectl debug node/<node-name> -it --image=busybox -- chroot /host sh" #debug into a node with a busybox container and chroot to the host filesystem
      - echo "kubectl debug -it <pod-name> -n <namespace> --image=busybox --target=container-name -- sh" #debug into a specific container in a pod 
      - echo "kubectl exec -it postgres-deploy-5cd7655b58-7982n -- psql -U rabie -d authdb -c "\dt" #list tables in authdb
      - echo "pg_isready -h  localhost -p 30003 -U rabie -d authdb" #check if postgres is ready locally through the nodeport



  svc:uninstall-all:
    desc: Delete all service resources
    cmds:
      - kubectl delete -f ./auth-service/manifest/. -n $NAMESPACE || true
      - kubectl delete -f ./converter-service/manifest/. -n $NAMESPACE || true
      - kubectl delete -f ./gateway-service/manifest/. -n $NAMESPACE || true
      - kubectl delete -f ./notification-service/manifest/. -n $NAMESPACE || true
