apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
  template:
    metadata:
      labels:
        app: auth
    spec:
      initContainers:
      - name: wait-for-db
        image: postgres:latest
        env:
          - name: DATABASE_HOST
            valueFrom:
              configMapKeyRef:
                name: auth-configmap
                key: DATABASE_HOST
        command:
          - sh
          - -c
          - |
            until pg_isready -h $DATABASE_HOST -p 5432; do
              echo "Waiting for PostgreSQL to be ready..."
              sleep 2
            done
      containers:
        - name: auth
          image: rabeea2100/auth
          # imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: auth-configmap
            - secretRef:
                name: auth-secret
